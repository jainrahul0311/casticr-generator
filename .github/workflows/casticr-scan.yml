# =============================================================================
#  .casticr scan
# =============================================================================
#  Two analyzers:
#    offline : castimaging/imaging-docker-offline-analyzer  (no key, no cloud)
#    online  : castimaging/imaging-docker-analyzer          (-ak key + cloud URL)
#
#  Scheduled run (14:30 UTC = 8 PM IST, Mon-Fri): OFFLINE analyzer, ALL projects.
#
#  Manual run (Actions tab -> Run workflow):
#    analyzer : online (default) | offline | both
#    project  : one project name from the PROJECTS list below, or blank for all
#    offline_tag : offline analyzer image tag: dev (default) | int | latest
#
#  Each project shows up as its own box in the run graph, with one job per
#  analyzer inside it. The per-project work lives in casticr-analyze.yml.
#
#  ---------------------------------------------------------------------------
#  TO ADD / REMOVE A PROJECT: edit the PROJECTS list below. Nothing else.
#    - name: the app name passed to the analyzer's -n flag (also the artifact
#            name, and what you type in the manual run's `project` box)
#    - url : the repo's public clone URL
#
#  REQUIRED SECRET (online analyzer only): IMAGING_ANALYSIS_KEY
#  ---------------------------------------------------------------------------
# =============================================================================

name: Scheduled .casticr scan

on:
  schedule:
    - cron: '30 14 * * 1-5'   # 14:30 UTC == 20:00 (8 PM) IST, Mon-Fri
  workflow_dispatch:
    inputs:
      analyzer:
        description: 'Analyzer to run'
        type: choice
        options: [online, offline, both]
        default: online
      project:
        description: 'Project name from the PROJECTS list (blank = all)'
        type: string
        required: false
        default: ''
      offline_tag:
        description: 'Offline analyzer image tag (castimaging/imaging-docker-offline-analyzer)'
        type: choice
        options: [dev, int, latest]
        default: dev

permissions:
  contents: read

concurrency:
  group: casticr-scan
  cancel-in-progress: false

env:
  # ===== EDIT THIS LIST (name = -n app name, url = public clone URL) ========
  PROJECTS: |
    - name: aws-mainframe-mainframe
      url: https://github.com/aws-samples/aws-mainframe-modernization-carddemo
    - name: razorpay-dotnet
      url: https://github.com/razorpay/razorpay-dotnet-testapp.git
    - name: spring-petclinic-microservices-jee
      url: https://github.com/spring-petclinic/spring-petclinic-microservices
    - name: eshop-csharp-dotnet
      url: https://github.com/dotnet-architecture/eShopModernizing
    - name: guava-jee
      url: https://github.com/google/guava.git
    - name: strix-python
      url: https://github.com/usestrix/strix.git
    - name: nopCommerce
      url: https://github.com/nopSolutions/nopCommerce
  # ==========================================================================

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.plan.outputs.projects }}
      analyzers: ${{ steps.plan.outputs.analyzers }}
      offline_tag: ${{ steps.plan.outputs.offline_tag }}
    steps:
      - name: Pick projects and analyzers
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          ANALYZER: ${{ inputs.analyzer }}
          PROJECT: ${{ inputs.project }}
          OFFLINE_TAG: ${{ inputs.offline_tag }}
        run: |
          set -euo pipefail

          # PROJECTS (YAML) -> compact JSON array of {name, url}
          all="$(printf '%s\n' "$PROJECTS" | yq -o=json -I=0 '.')"
          bad="$(jq -r '[.[] | select((.name // "") == "" or (.url // "") == "")] | length' <<<"$all")"
          if [ "$bad" != "0" ]; then
            echo "::error::Every PROJECTS entry needs both a name and a url."
            exit 1
          fi
          dupes="$(jq -r '[.[].name] | group_by(.) | map(select(length > 1) | .[0]) | join(", ")' <<<"$all")"
          if [ -n "$dupes" ]; then
            echo "::error::Duplicate project names in PROJECTS: $dupes"
            exit 1
          fi

          # Analyzers: the schedule always runs offline only.
          if [ "$EVENT" = "schedule" ]; then
            ANALYZER=offline
            PROJECT=""
            OFFLINE_TAG=dev
          fi
          OFFLINE_TAG="${OFFLINE_TAG:-dev}"
          case "${ANALYZER:-offline}" in
            offline) analyzers='["offline"]' ;;
            online)  analyzers='["online"]' ;;
            both)    analyzers='["offline","online"]' ;;
            *) echo "::error::Unknown analyzer '$ANALYZER'"; exit 1 ;;
          esac

          # Projects: blank = all, otherwise exactly one matching name.
          PROJECT="$(printf '%s' "$PROJECT" | xargs)"   # trim spaces
          if [ -z "$PROJECT" ]; then
            projects="$all"
          else
            projects="$(jq -c --arg p "$PROJECT" '[.[] | select(.name == $p)]' <<<"$all")"
            if [ "$projects" = "[]" ]; then
              echo "::error::No project named '$PROJECT'. Valid names: $(jq -r '[.[].name] | join(", ")' <<<"$all")"
              exit 1
            fi
          fi

          echo "projects=$projects"   >> "$GITHUB_OUTPUT"
          echo "analyzers=$analyzers" >> "$GITHUB_OUTPUT"
          echo "offline_tag=$OFFLINE_TAG" >> "$GITHUB_OUTPUT"
          {
            echo "### Plan"
            echo "- Analyzer(s): \`$analyzers\`"
            echo "- Offline image tag: \`$OFFLINE_TAG\`"
            echo "- Projects: $(jq -r '[.[].name] | join(", ")' <<<"$projects")"
          } >> "$GITHUB_STEP_SUMMARY"

  scan:
    name: ${{ matrix.project.name }}
    needs: plan
    strategy:
      fail-fast: false          # one project failing must NOT cancel the others
      # max-parallel: 5         # uncomment to cap how many projects run at once
      matrix:
        project: ${{ fromJSON(needs.plan.outputs.projects) }}
    uses: ./.github/workflows/casticr-analyze.yml
    with:
      app_name: ${{ matrix.project.name }}
      repo_url: ${{ matrix.project.url }}
      analyzers: ${{ needs.plan.outputs.analyzers }}
      offline_tag: ${{ needs.plan.outputs.offline_tag }}
    secrets:
      IMAGING_ANALYSIS_KEY: ${{ secrets.IMAGING_ANALYSIS_KEY }}
